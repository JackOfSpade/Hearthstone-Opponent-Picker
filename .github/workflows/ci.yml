name: CI

# No branch filter on push: the auto-merge-to-main workflow gates merges on
# finding a green run of this exact workflow ("CI") for a given commit SHA,
# on whatever branch that commit lives on — so this must run everywhere.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Was `.[dev]` only, on the premise that vision/web/hotkeys imports are
      # always guarded with a pure-Python fallback. That stopped being true
      # once new tests started importing numpy/etc. directly (unguarded) —
      # skip `mac` here since pyobjc-framework-* is macOS-only and would
      # break this Linux runner.
      - name: Install package with dev dependencies
        run: pip install -e '.[dev,vision,web,hotkeys]'

      - name: Run test suite
        run: pytest -q
