# hop - default configuration.
#
# This file ships the reference priors from §8 of the Humanization Standard.
# Per the standard: "These are priors measured on one reference phone with one
# human. They are starting points, not universal constants." Anything that MUST
# be re-measured on your actual phone before trusting auto mode is tagged
# LIVE-VERIFY in a comment. Run `hop calibrate` to derive real values (§10).
#
# User settings you'll actually edit live under [criteria], [risk], [device]
# and [alerts]. The [motor], [timing], [contact], [scroll], [sensor], [caps]
# and [vision] tables are the humanization priors - leave them unless you have
# a measurement (provenance note required next to any change).

# ─────────────────────────── USER SETTINGS ───────────────────────────

[criteria]
# Opponent classes you WANT to face. Empty list = any class is acceptable.
target_classes = []
# Classes to avoid (blocklist). Ignored if target_classes is non-empty.
avoid_classes = []
# Keep the game only when WE go second (mulligan deals us 4 cards, not 3).
require_second = false
# "casual" avoids cratering ranked MMR while hunting; "ranked" if you must.
mode = "casual"

[device]
# Wireless-ADB address of the phone (host:port). `hop connect` can discover it.
adb_address = ""
# The opponent's class label sits under the BOTTOM-LEFT portrait; you are
# bottom-right. Verified from real mobile mulligan screenshots.
opponent_corner = "bottom_left"
# Touch transport: auto prefers a persistent virtual HID digitizer (full
# pressure/size/geometry) and falls back to `adb input` if unavailable.
#   auto | uhid | adb
touch_backend = "auto"
# Test posture for sensorimotor coherence (§ Layer 4). A desk-mounted phone
# driven over ADB cannot honestly claim handheld IMU realism; declare it.
#   handheld | desk_mounted
posture = "desk_mounted"

[uhid]
# Panel-matched input-device identity for the persistent virtual digitizer
# (Layer 1). The standard: "A vendor_id/product_id of 0x0000 with a generic
# name (uhid-touchscreen) is a giveaway; sane, panel-plausible identifiers are
# the floor." LIVE-VERIFY: clone your real panel's InputDevice vid/pid/name
# (see `hop doctor`, which reads `dumpsys input`). These defaults are plausible
# but generic - replace them with your phone's true panel identifiers.
device_name = "synaptics_dsx"     # LIVE-VERIFY: your panel's reported name
vendor_id = 0x0596                 # LIVE-VERIFY
product_id = 0x0501                # LIVE-VERIFY
bus = "usb"                        # usb | bluetooth
min_report_interval_ms = 2         # floor between HID reports (avoid flooding)
# The session's ONE `hid` process reads a stream of bare JSON objects on stdin
# (no on-device FIFO: mkfifo is SELinux-denied for shell on modern Android).
# After `register` we wait this long for the framework to enumerate the virtual
# InputDevice before the first gesture, so early reports aren't dropped.
register_settle_ms = 150           # LIVE-VERIFY: enumeration settle after register
# Contact-channel logical maxima. 0 = clone them from the real panel at startup.
# This is NOT optional polish: Android loads the panel's calibration by device
# NAME and applies it to our reports, so cloning the name while declaring
# different axis ranges makes the framework size our contact against the wrong
# scale. Measured on a Pixel 7a (panel TOUCH_MAJOR max 2399): with the old 255
# ceiling, Hearthstone silently ignored every tap on a mulligan card while still
# honouring taps on buttons.
touch_major_max = 0
touch_minor_max = 0
pressure_max = 0
orientation_max = 0

[alerts]
mac_notification = true
mac_sound = true
mac_speak = false           # spoken "Mage found" via `say`
sound_name = "Glass"        # a /System/Library/Sounds name, looped until ack
ntfy_topic = ""             # optional phone push via ntfy.sh (loud, no account)
ntfy_server = "https://ntfy.sh"

[risk]
# cautious | balanced | aggressive - selects a bundle of pacing multipliers
# applied on top of [caps] and the concede journey grammar.
profile = "cautious"

# ─────────────────────── HUMANIZATION PRIORS (§8) ───────────────────────
# Provenance for every value below: "reference phone, one human" per the
# standard. Re-measure via `hop calibrate` (§10) and record device/date here.

[timing]
sigma = 0.22                       # log-normal spread for human_delay/cooldown
between_action_anchor_s = 3.5      # typical inter-action pause; spread, don't burst
read_consider_dwell_s = 1.1        # per-item consideration pause
# Per-decision think time = shifted-lognormal(shift, mu, sigma), then modulated
# by HumanState. A committing action is a faster reaction than a rejecting one.
think_commit_shift = 1.2
think_commit_mu = 0.65
think_commit_sigma = 0.35          # -> ~3.2 s median
think_reject_shift = 1.8
think_reject_mu = 1.45
think_reject_sigma = 0.42          # -> ~6.9 s median

[motor]
# FFitts (Bi & Zhai), not vanilla Fitts. a,b in seconds; precision term in mm.
ffitts_a = 0.11
ffitts_b = 0.17
finger_precision_mm = 1.15         # absolute endpoint-ambiguity sigma_a (§8)
default_target_w_px = 180          # LIVE-VERIFY: typical control width on your res
velocity_peak_frac = 0.35          # tangential velocity peaks early
velocity_sigma = 0.18
submovement_min = 0               # corrective minimum-jerk submovements near target
submovement_max = 3               # grows with target difficulty
tremor_amplitude_mm = 0.14         # ~2.2 px @ ~400dpi -> mm; correlated OU texture
tremor_theta = 40.0                # OU reversion rate
report_rate_hz = 180               # LIVE-VERIFY: modern panels run 240/720/1200/2000
tap_dwell_median_s = 0.13          # lognormal down->up
tap_dwell_sigma = 0.25
tap_dwell_min_s = 0.06             # LIVE-VERIFIED: no real contact was under 65ms
tap_dwell_max_s = 0.35
tap_micro_slip_px = 2.5            # finger-pad settle-and-slide on impact

[contact]
# Contact-patch evolution. RESPECT DEVICE PRESSURE SEMANTICS: if the panel
# reports binary/1.0 pressure, a faithful flat signal beats a fake ramp.
#   ramp | binary | amplitude  (LIVE-VERIFY against getevent ABS_MT_PRESSURE)
pressure_semantics = "ramp"
pressure_alpha = 1.25              # beta ramp u^a (1-u)^b
pressure_beta = 0.85
# All four below are FRACTIONS OF THE PANEL'S OWN AXIS MAXIMA (see [uhid] axes),
# so they transfer across devices. LIVE-VERIFIED against a human swipe captured
# with `getevent -lt` on a Pixel 7a / goodix_ts0 (n=24 gestures):
#   ABS_MT_PRESSURE     in-contact p10 0.52, median 0.80, peak 1.00 (of 255)
#   ABS_MT_TOUCH_MAJOR  0.029 - 0.122 of 2399, median 0.090
#   minor/major raw ratio 0.758
# The old defaults (floor 0.22, major_peak 0.55) were less than half the real
# touch-down pressure and ~6x the real contact size.
pressure_peak = 0.98
pressure_floor = 0.52              # ~detection threshold; NEVER 0 while in contact
contact_major_peak = 0.12          # fraction of ABS_MT_TOUCH_MAJOR max
contact_minor_ratio = 0.76         # minor/major, in raw panel units
orientation_bias_rad = 0.0         # grip/handedness bias; LIVE-VERIFY

[scroll]
# Android OverScroller fling physics. Not used by the core mulligan flow, but
# implemented for any collection scrolling and for realism of idle behavior.
fling_friction = 0.015             # OverScroller default-ish deceleration
ppi_reference = 160.0
reading_pause_s = 1.4              # content-dependent pause between flings

[sensor]
# Sensorimotor coherence priors (§ Layer 4). Used to GENERATE the predicted
# inertial side effect and to VALIDATE coherence in Layer 6. On desk_mounted
# posture we do not inject sensors; we assert flatness is expected and do not
# claim handheld realism.
tap_impulse_g = 0.3                # accel spike per tap; direction from location
swipe_torque_dps = 1.4             # angular side effect per swipe
poll_rate_hz = 100

[caps]
# Behavioral hygiene (§ Layer 5). Conservative starting caps; the risk profile
# scales them. When a cap is hit the run STOPS (never substitutes an action).
max_actions_per_run = 30
max_actions_per_day = 50
committing_action_cap = 15         # the key cap: holds the concede/commit ratio human
max_games_per_session = 60
max_session_minutes = 120
mandatory_break_every_games = 12   # take a randomized break after N games
break_min_minutes = 5
break_max_minutes = 20
non_repetition_threshold = 0.06    # reject trajectories that near-duplicate a prior run

[vision]
state_change_threshold = 9.0       # mean grayscale delta (0..255, 24x24) = "changed"
dedupe_signature_size = 24         # NxN downsample for frame-advance detection
ncc_match_threshold = 0.72         # normalized cross-correlation accept level
ocr_max_edit_distance = 3          # snap-to-class fails closed beyond this
weak_match_margin = 0.08           # match this-close to threshold => low confidence -> inspect
# Hearthstone animates between screens, so a single unrecognized frame usually
# means we looked mid-transition (e.g. the blurred board fade after a concede),
# not that we are lost. Re-look this many times - never tapping - before failing
# closed on UNKNOWN.
unknown_settle_attempts = 4
# Waiting for a screen to change is done by LOOKING, never by sleeping a fixed
# amount: screencap costs ~1.0 s over USB and ~1.4 s over Wi-Fi on this phone, and
# Hearthstone's own transitions stretch with the network. A fixed delay is a guess
# that is either wasted time or a blind tap. `wait_until` polls the classifier under
# BOTH bounds below - whichever trips first - and never taps while waiting.
screen_wait_attempts = 8           # max polls (a frozen-clock test needs this bound)
screen_wait_timeout_s = 20.0       # wall-clock cut, for when captures are slow
screen_wait_poll_s = 1.0           # nominal gap between polls (humanized per draw)
# Hearthstone shuts down idle connections ("You are currently offline"), which the
# hunt loop's own anti-barcode pacing provokes. Tapping Reconnect starts an
# ASYNCHRONOUS reconnect: the body becomes "Reconnecting..." and both buttons are
# removed, so the loop must WAIT rather than re-tap. Poll this many times - never
# tapping - for the attempt to resolve...
reconnecting_wait_attempts = 12
# ...and make at most this many Reconnect taps per run. A reconnect that keeps
# failing means the network or the account needs a human, so fail closed.
reconnect_attempt_cap = 3
# Hearthstone accepts a mulligan card tap only intermittently -- ~1 time in 3, while
# accepting every button tap. Cause UNKNOWN; see CALIBRATION.md. Ruled out by
# measurement: contact scale, position, dwell, micro-slip, event delivery, and (via a
# screenrecord of the deal-in) both "the cards are still animating" and "the latched
# centres are stale" -- the hand is at rest 0.2s after the banner matches and the
# centres are good to 8px against a 176px card half-width.
# Retry a bounded number of times, then KEEP the card: a card that won't toggle is not
# an unknown state (we are still on the mulligan), so halting the hunt over it would be
# fail-closed applied where nothing is closed.
mulligan_card_tap_attempts = 3
# Mulligan card counting. Every card is outlined by a saturated green "keep" glow.
# The glow is UI chrome, so - unlike the mana gems or a brightness profile, both of
# which this replaced - card artwork cannot fake it. A strip must span most of the
# band's HEIGHT: the glow runs a card's full height, a patch of green art does not.
glow_green_bias = 30               # green must exceed red AND blue by this much
glow_min_green = 90                # ...and be at least this bright
glow_col_min_frac = 0.50           # a column counts if >=this fraction of band rows glow
glow_min_strip_frac = 0.0033       # ignore strips narrower than this (~8px @ 2400)
# We count CARD INTERIORS between the strips, not the strips themselves: glows merge
# when cards sit close, so 3 cards make 6 strips while 4 cards make 5. An interior
# is a span that is both card-WIDE and card-BRIGHT; the background gap between two
# cards is ~2.7x narrower and ~3x darker, so the two tests are orthogonal with a
# wide margin. A total that isn't 3 or 4 -> unreadable -> the engine fails closed
# rather than guess, because a wrong count inverts `require_second`.
card_width_tolerance = 0.15        # accept interiors within +/- this fraction of card_inner_w_f
card_min_gray = 60.0               # mean gray of a card interior (gaps measure 33-35)
# A card MARKED FOR REPLACEMENT loses its keep-glow, so its interior disappears. On
# a 4-card hand that leaves 3 -- a plausible reading that silently inverts
# `require_second`. Two structural facts about a real hand catch it:
#   contiguity: adjacent cards are separated by 0.014-0.082 W; a missing INNER card
#               leaves a hole a whole card wide (measured 0.197 W)
#   symmetry:   the hand is centred; a missing OUTER card keeps the survivors evenly
#               spaced but shifts their mean centre by ~0.085 W
card_max_separation_f = 0.12       # max gap between adjacent card interiors
hand_center_tolerance_f = 0.02     # mean interior centre must be this close to hand_center_xf
# Below this frame width a keep-glow strip (~1.2% of the screen) drops under
# `glow_min_strip_frac` and disappears, which merges two card interiors and
# UNDERCOUNTS instead of failing. Refuse outright. Measured: correct down to
# 400px; at 300px a 4-card hand reads 3. Real screencaps are 2400px wide.
min_count_frame_width = 400

[debug]
# Capture is for analysis; once analysed the pixels are dead weight. A 2400x1080
# grayscale anomaly PNG is ~1 MB and an unattended hunt can throw many (a single
# debugging session left 10 MB behind), so both the per-run frame count and the
# number of retained runs are bounded. The journal - append-only JSONL, a few KB -
# is what a halt is actually diagnosed from, and it rides along with its run dir.
# Oldest is pruned first: a halt is explained by the anomaly that stopped it, and
# that is the newest one. Set max_anomaly_frames = 0 to keep no pixels at all.
keep_runs = 5
max_anomaly_frames = 8            # 2 frames (before/after) per anomaly => 4 anomalies
# UNKNOWN screens are the one capture hop KEEPS. Every other frame can be re-taken;
# a screen the classifier could not name cannot -- it is a screen nobody anticipated
# (a "Ban Notice" modal, the Collection), it HALTS the loop, and those exact pixels
# are what the next anchor is built from (`hop capture --from-file`). They are saved
# in COLOUR to ~/.config/hop/unknowns/, a sibling of runs/ that `keep_runs` never
# touches, and that folder is EMPTY WHEN THE HUNT IS HEALTHY -- its non-emptiness is
# the signal. Empty it by hand once each frame has become an anchor.
# This bound is a runaway backstop, not a retention policy. 0 = never prune.
max_unknown_frames = 30

[calibration]
# Filled in by `hop calibrate`. device/date/tester provenance for the values
# actually measured on your phone. Empty = running on unverified priors.
device = ""
date = ""
tester = ""
